<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Bag | Flamlucent</title>
<style>
:root{--green:#202e19;--cream:#faf6ed;--gold:#ad8955;--ink:#28251e}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}
.announcement{background:var(--green);color:white;text-align:center;padding:12px;font-size:12px;letter-spacing:2px}
header{padding:22px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e4dbca;gap:12px}
.logo{font-family:Georgia,serif;font-size:clamp(20px,4vw,32px);letter-spacing:2px}
a{color:inherit;text-decoration:none}
nav{display:flex;gap:20px;font-size:13px}
main{max-width:1050px;margin:auto;padding:50px 5% 90px}
h1{font:normal clamp(34px,6vw,52px) Georgia,serif;text-align:center;margin:0 0 12px}
.intro{text-align:center;color:#756e63;margin-bottom:45px}
.layout{display:grid;grid-template-columns:1.7fr 1fr;gap:35px}
.item{display:flex;gap:18px;padding:23px 0;border-bottom:1px solid #ded5c7}
.photo{width:100px;min-width:100px;height:115px;border-radius:12px;background:#d9ddcf;display:grid;place-items:center;font-size:36px}
.details{flex:1}
h2{font:normal 24px Georgia,serif;margin:0 0 8px}
.muted{color:#81786e;font-size:13px}
.controls{display:flex;align-items:center;gap:14px;margin-top:17px;flex-wrap:wrap}
.qty{display:flex;border:1px solid #cfc5b4;border-radius:6px;align-items:center}
.qty button{background:transparent;color:var(--ink);border:0;padding:9px 13px;font-size:18px;cursor:pointer}
.qty span{min-width:25px;text-align:center}
.remove{background:none;border:0;text-decoration:underline;color:#786e61;cursor:pointer}
.summary{background:#f0e9dd;padding:28px;border-radius:12px;align-self:start}
.summary h2{margin-bottom:24px}
.line{display:flex;justify-content:space-between;margin:15px 0}
.total{border-top:1px solid #d1c5b5;padding-top:18px;font-weight:bold;font-size:20px}
.checkout{display:block;width:100%;background:var(--green);color:white;border:0;padding:17px;text-align:center;border-radius:6px;margin-top:25px;font-size:14px;letter-spacing:1px;cursor:pointer}
.note{font-size:12px;color:#716a5f;line-height:1.6;margin-top:18px}
.continue{display:inline-block;margin-top:25px;text-decoration:underline;color:var(--green)}
.empty{text-align:center;padding:60px 10px}
.empty p{color:#777}
footer{text-align:center;padding:28px;border-top:1px solid #e1d7c7;font-size:12px;color:#786e61}
@media(max-width:700px){.layout{grid-template-columns:1fr}main{padding-top:35px}.item{gap:12px}.photo{width:78px;min-width:78px;height:95px}.summary{margin-top:10px}header{padding:18px 4%}nav{gap:12px}}
</style>
</head>
<body>
<div class="announcement">✦ LIGHT THE MOOD. SET THE INTENTION. ✦</div>
<header>
<a class="logo" href="index.html">♧ FLAMLUCENT</a>
<nav><a href="index.html">HOME</a><a href="shop.html">SHOP</a><a href="cart.html">BAG</a></nav>
</header>
<main>
<h1>Your Shopping Bag</h1>
<p class="intro">A little something lovely is on its way.</p>
<div id="content"></div>
</main>
<footer>FLAMLUCENT · Hand-poured with care. Made with intention.</footer>
<script>
const KEY="flamlucentCart";
let cart=[];
try{const saved=JSON.parse(localStorage.getItem(KEY)||"[]");cart=Array.isArray(saved)?saved:[]}catch(e){cart=[]}
function nameOf(p){return String(p.name||p.title||"Candle")}
function priceOf(p){return Number(p.price)||15}
function qtyOf(p){return Math.max(1,Number(p.quantity||p.qty)||1)}
function save(){localStorage.setItem(KEY,JSON.stringify(cart))}
function money(n){return "$"+n.toFixed(2)}
function change(i,d){cart[i].quantity=qtyOf(cart[i])+d;if(cart[i].quantity<=0)cart.splice(i,1);save();render()}
function removeItem(i){cart.splice(i,1);save();render()}
function checkout(){alert("Checkout is not connected yet. We will connect your Square payment system before accepting orders.")}
function render(){
const root=document.getElementById("content");
if(!cart.length){root.innerHTML='<div class="empty"><h2>Your bag is waiting for something special.</h2><p>Discover a scent that speaks to you.</p><a class="checkout" href="shop.html" style="max-width:260px;margin:25px auto">SHOP CANDLES</a></div>';return}
let subtotal=0;
const items=cart.map((p,i)=>{
const q=qtyOf(p),price=priceOf(p);subtotal+=price*q;
return '<div class="item"><div class="photo">🕯️</div><div class="details"><h2>'+escapeHtml(nameOf(p))+'</h2><div class="muted">Hand-Poured Candle · '+money(price)+' each</div><div class="controls"><div class="qty"><button onclick="change('+i+',-1)" aria-label="Decrease quantity">−</button><span>'+q+'</span><button onclick="change('+i+',1)" aria-label="Increase quantity">+</button></div><button class="remove" onclick="removeItem('+i+')">Remove</button><strong style="margin-left:auto">'+money(price*q)+'</strong></div></div></div>'
}).join("");
root.innerHTML='<div class="layout"><section>'+items+'<a class="continue" href="shop.html">← Continue Shopping</a></section><aside class="summary"><h2>Order Summary</h2><div class="line"><span>Subtotal</span><span>'+money(subtotal)+'</span></div><div class="line"><span>Shipping</span><span>Calculated at checkout</span></div><div class="line total"><span>Subtotal</span><span>'+money(subtotal)+'</span></div><button class="checkout" onclick="checkout()">PROCEED TO CHECKOUT</button><p class="note">Checkout is coming soon. No payments are collected on this page yet.</p></aside></div>'
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
render();
</script>
</body>
</html>
